<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4b2d25">
  <title>모찌 공장</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 20px;
      background: #fff5ea;
      color: #4b2d25;
      font-family: "Malgun Gothic", sans-serif;
    }

    main {
      width: min(100%, 960px);
      margin: 0 auto;
    }

    .game-area {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 2px solid #8d5b4c;
      background: #fff9f2;
    }

    .game-area canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <main>
    <section id="game" class="game-area" aria-label="모찌 공장 게임 영역"></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
