<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17211d">
  <title>불과 물</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 20px;
      background: #f1f3ef;
      color: #17211d;
      font-family: "Malgun Gothic", sans-serif;
    }

    main {
      width: min(100%, 960px);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 28px;
    }

    .game-area {
      position: relative;
      display: grid;
      aspect-ratio: 16 / 9;
      place-items: center;
      border: 2px solid #34463d;
      background: #17211d;
      color: #f1f3ef;
    }

    .game-area canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .stage-name {
      position: absolute;
      z-index: 1;
      top: 16px;
      left: 18px;
      margin: 0;
      color: #d5dfd8;
      font-size: 14px;
    }

    .game-area p {
      margin: 0;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <main>
    <h1>불과 물</h1>
    <section class="game-area" aria-label="게임 영역">
      <p class="stage-name">튜토리얼 스테이지</p>
      <canvas id="game-canvas" width="960" height="540" aria-label="게임 화면">
        이 브라우저는 캔버스를 지원하지 않습니다.
      </canvas>
    </section>
  </main>
  <script>
    const canvas = document.querySelector("#game-canvas");
    const context = canvas.getContext("2d");
    const currentStage = {
      width: 960,
      height: 540,
      platforms: [
        { x: 0, y: 500, width: 960, height: 40 },
      ],
    };

    function renderFrame() {
      context.fillStyle = "#17211d";
      context.fillRect(0, 0, currentStage.width, currentStage.height);

      for (const platform of currentStage.platforms) {
        context.fillStyle = "#68796e";
        context.fillRect(platform.x, platform.y, platform.width, platform.height);
      }

      requestAnimationFrame(renderFrame);
    }

    requestAnimationFrame(renderFrame);
  </script>
</body>
</html>
